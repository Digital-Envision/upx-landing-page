name: CD landing page staging

on:
  push:
    branches: [ staging ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          NODE_ENV: ${{ secrets.NODE_ENV }}
          NOTIFY_EMAIL_ENABLED: ${{ secrets.NOTIFY_EMAIL_ENABLED }}
          SMTP2GO_API_KEY: ${{ secrets.SMTP2GO_API_KEY }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          APP_PORT: ${{ secrets.APP_PORT }}
          PULSE_DEAL_SYNC_ENABLED: ${{ secrets.PULSE_DEAL_SYNC_ENABLED }}
          PULSE_SYNC_URL: ${{ secrets.PULSE_SYNC_URL }}
          PULSE_SYNC_SECRET: ${{ secrets.PULSE_SYNC_SECRET }}
          PULSE_LEAD_CAPTURE_ENABLED: ${{ secrets.PULSE_LEAD_CAPTURE_ENABLED }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: NODE_ENV,APP_PORT,NOTIFY_EMAIL_ENABLED,SMTP2GO_API_KEY,NOTIFY_EMAIL_FROM,NOTIFY_EMAIL_TO,PULSE_DEAL_SYNC_ENABLED,PULSE_SYNC_URL,PULSE_SYNC_SECRET,PULSE_LEAD_CAPTURE_ENABLED
          script: |
            set -e # Exit immediately if any command fails
            echo "Deploying app on the server..."

            APP_DIR="${{ secrets.APP_DIR }}"
            cd "$APP_DIR"

            # Ensure Bun binaries are available in SSH non-interactive session
            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$PATH"

            # Sync code
            git checkout staging
            git pull origin staging

            echo "Writing environment variables..."
            cat << EOF > .env
            NODE_ENV=$NODE_ENV
            NOTIFY_EMAIL_ENABLED=$NOTIFY_EMAIL_ENABLED
            SMTP2GO_API_KEY=$SMTP2GO_API_KEY
            NOTIFY_EMAIL_FROM=$NOTIFY_EMAIL_FROM
            NOTIFY_EMAIL_TO=$NOTIFY_EMAIL_TO
            APP_PORT=$APP_PORT
            PULSE_DEAL_SYNC_ENABLED=$PULSE_DEAL_SYNC_ENABLED
            PULSE_SYNC_URL=$PULSE_SYNC_URL
            PULSE_SYNC_SECRET=$PULSE_SYNC_SECRET
            PULSE_LEAD_CAPTURE_ENABLED=$PULSE_LEAD_CAPTURE_ENABLED
            EOF
            
            # Build and reload service
            bun install --frozen-lockfile
            bun run build

            pm2 reload ecosystem.config.cjs || pm2 start ecosystem.config.cjs
            pm2 save

            echo "✅ Deployment finished"
